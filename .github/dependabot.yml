# Keep every committed manifest, nested workflow and composite action covered.
version: 2
updates:
  - package-ecosystem: composer
    directory: /
    cooldown:
      default-days: 7
    schedule:
      interval: weekly
    groups:
      composer:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directories:
      - /
      - /docs/case-studies/issue-1/data/templates/js
      - /docs/case-studies/issue-1/data/templates/python
      - /docs/case-studies/issue-1/data/templates/rust
      - /docs/case-studies/issue-1/data/templates/csharp
    cooldown:
      default-days: 7
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: dotnet-sdk
    directories:
      - /
      - /docs/case-studies/issue-1/data/templates/csharp
    cooldown:
      default-days: 7
    schedule:
      interval: weekly
    groups:
      dotnet-sdk:
        patterns: ["*"]
  - package-ecosystem: nuget
    directories:
      - /docs/case-studies/issue-1/data/templates/csharp
      - /docs/case-studies/issue-1/data/templates/csharp/src/MyPackage
      - /docs/case-studies/issue-1/data/templates/csharp/tests/MyPackage.Tests
    cooldown:
      default-days: 7
    schedule:
      interval: weekly
    groups:
      nuget:
        patterns: ["*"]
  - package-ecosystem: pre-commit
    directories:
      - /docs/case-studies/issue-1/data/templates/csharp
      - /docs/case-studies/issue-1/data/templates/python
      - /docs/case-studies/issue-1/data/templates/rust
    cooldown:
      default-days: 7
    schedule:
      interval: weekly
  - package-ecosystem: pip
    directories:
      - /docs/case-studies/issue-1/data/templates/python
      - /docs/case-studies/issue-1/data/templates/python/docs
    cooldown:
      default-days: 7
    schedule:
      interval: weekly
    groups:
      python:
        patterns: ["*"]
  - package-ecosystem: npm
    directories:
      - /docs/case-studies/issue-1/data/templates/js
      - /docs/case-studies/issue-1/data/templates/js/examples/universal-app
    cooldown:
      default-days: 7
    schedule:
      interval: weekly
    groups:
      npm:
        patterns: ["*"]
  - package-ecosystem: cargo
    directories:
      - /docs/case-studies/issue-1/data/templates/rust
      - /docs/case-studies/issue-1/data/templates/rust/pipeline
    cooldown:
      default-days: 7
    schedule:
      interval: weekly
    groups:
      rust:
        patterns: ["*"]
