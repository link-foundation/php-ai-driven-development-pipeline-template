# Keep every committed manifest, nested workflow and composite action covered.
version: 2
updates:
  - package-ecosystem: composer
    directory: /
    schedule:
      interval: weekly
    groups:
      composer:
        patterns: ['*']
  - package-ecosystem: github-actions
    directories:
      - /
      - /docs/case-studies/issue-1/data/templates/js
      - /docs/case-studies/issue-1/data/templates/python
      - /docs/case-studies/issue-1/data/templates/rust
      - /docs/case-studies/issue-1/data/templates/csharp
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
  - package-ecosystem: nuget
    directories:
      - /docs/case-studies/issue-1/data/templates/csharp
      - /docs/case-studies/issue-1/data/templates/csharp/src/MyPackage
      - /docs/case-studies/issue-1/data/templates/csharp/tests/MyPackage.Tests
    schedule:
      interval: weekly
    groups:
      nuget:
        patterns: ['*']
  - package-ecosystem: pre-commit
    directories:
      - /docs/case-studies/issue-1/data/templates/csharp
      - /docs/case-studies/issue-1/data/templates/python
      - /docs/case-studies/issue-1/data/templates/rust
    schedule:
      interval: weekly
  - package-ecosystem: pip
    directories:
      - /docs/case-studies/issue-1/data/templates/python
      - /docs/case-studies/issue-1/data/templates/python/docs
    schedule:
      interval: weekly
    groups:
      python:
        patterns: ['*']
  - package-ecosystem: npm
    directory: /docs/case-studies/issue-1/data/templates/js
    schedule:
      interval: weekly
    groups:
      npm:
        patterns: ['*']
  - package-ecosystem: cargo
    directories:
      - /docs/case-studies/issue-1/data/templates/rust
      - /docs/case-studies/issue-1/data/templates/rust/pipeline
    schedule:
      interval: weekly
    groups:
      rust:
        patterns: ['*']
