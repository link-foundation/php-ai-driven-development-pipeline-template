name: Docs

# Builds API documentation with phpDocumentor on every push/PR that touches
# src/, docs/ or this workflow. To publish on pushes to main, set the Pages
# source to "GitHub Actions" and repository variable DEPLOY_GITHUB_PAGES to true.

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'src/**'
      - 'composer.json'
      - '.github/workflows/docs.yml'
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'docs/**'
      - 'src/**'
      - 'composer.json'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    name: Build docs
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@2.40.0
        with:
          php-version: '8.5.12'
          coverage: none
          tools: phpDocumentor:3.10.0

      - name: Build API documentation
        run: phpDocumentor --directory=src --target=_site --title="$(php -r "echo json_decode(file_get_contents('composer.json'))->name;")"

      - name: Upload build artifact
        uses: actions/upload-artifact@v7.0.2
        with:
          name: docs-site
          path: _site
          if-no-files-found: error

      - name: Explain how to enable Pages deployment
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.DEPLOY_GITHUB_PAGES != 'true'
        run: echo "::notice::GitHub Pages deployment skipped. Set Settings > Pages > Source to GitHub Actions and the DEPLOY_GITHUB_PAGES repository variable to true to enable deployment."

  deploy:
    name: Deploy to GitHub Pages
    needs: [build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.DEPLOY_GITHUB_PAGES == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6.0.0

      - name: Download build artifact
        uses: actions/download-artifact@v8.0.2
        with:
          name: docs-site
          path: _site

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: _site

      - name: Deploy Pages artifact
        id: deployment
        uses: actions/deploy-pages@v5.0.1

  # === PIPELINE STATUS ===
  # GitHub reports jobs killed by timeout-minutes as cancelled. Observe every
  # job so a timeout on main becomes a visible failure instead of a grey run,
  # while a run superseded by a newer commit is recognised as expected churn
  # (issue #9).
  pipeline-status:
    name: Pipeline Status
    needs:
      - build
      - deploy
    if: always()
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Check aggregate pipeline status
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          RUN_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          BRANCH_REF: ${{ github.head_ref || github.ref_name }}
          GIT_REMOTE: ${{ github.event.pull_request.head.repo.clone_url || 'origin' }}
        run: bash scripts/check-pipeline-status.sh
