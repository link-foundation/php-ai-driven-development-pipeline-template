name: Captured templates

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "41 7 * * 1"

permissions:
  contents: read

concurrency:
  group: templates-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  GIT_CONFIG_COUNT: "1"
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: main

jobs:
  javascript:
    runs-on: ubuntu-26.04
    timeout-minutes: 25
    defaults:
      run:
        working-directory: docs/case-studies/issue-1/data/templates/js
    env:
      HUSKY: "0"
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "26.13.1"
          cache: npm
          cache-dependency-path: docs/case-studies/issue-1/data/templates/js/**/package-lock.json
      # Exact bootstrap tool version; npm itself is the lockfile installer.
      - run: npm install --global npm@12.2.2 # zizmor: ignore[adhoc-packages]
      - run: npm ci
      - run: npm ci --prefix examples/universal-app
      - run: npm test
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: "1.4.4"
      - run: bun test --timeout 30000 tests
      - uses: denoland/setup-deno@v2.0.5
        with:
          deno-version: "2.9.8"
      - run: deno test --frozen-lockfile --allow-read --allow-write --allow-env --allow-run tests
      - run: npm run check
      - run: npm pack --dry-run
      - run: npm run example:web:build
      - run: npm run example:desktop:package
      - run: npm run example:mobile:sync
      - run: deno audit
      - run: npm audit
      - run: npm audit --prefix examples/universal-app

  python:
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: docs/case-studies/issue-1/data/templates/python
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.15.2"
          cache: pip
          cache-dependency-path: docs/case-studies/issue-1/data/templates/python/requirements.lock
      - run: |
          python -m pip install --upgrade pip==26.3
          pip install -r requirements.lock
          pip install --no-deps --no-build-isolation .
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy src tests
      - run: pytest --cov=src --cov-report=term-missing
      - run: python -m build --no-isolation
      - run: twine check dist/*
      - run: sphinx-build -W --keep-going -b html docs docs/_build/html
      - run: pip-audit -r requirements.lock
      - name: Validate every pre-commit configuration
        run: |
          pre-commit validate-config .pre-commit-config.yaml
          pre-commit validate-config ../csharp/.pre-commit-config.yaml
          pre-commit validate-config ../rust/.pre-commit-config.yaml

  csharp:
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: docs/case-studies/issue-1/data/templates/csharp
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v6.1.0
        with:
          dotnet-version: "11.0.100"
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: "1.4.4"
      # GitHub's automatic NuGet submission restores from the repository root.
      # Exercise that SDK lookup as well as the template-local build/test setup.
      - run: dotnet restore docs/case-studies/issue-1/data/templates/csharp/MyPackage.sln --locked-mode
        working-directory: .
      - run: dotnet build --no-restore
      - run: dotnet test --no-build --timeout 60s --coverlet --coverlet-output-format cobertura
      - run: dotnet format --verify-no-changes --no-restore
      - run: dotnet pack src/MyPackage --no-restore
      - run: bun test --timeout 30000 scripts
      - run: dotnet tool restore
      - run: dotnet docfx docfx.json --warningsAsErrors
      - name: Audit all NuGet dependencies
        run: |
          dotnet package list --include-transitive --vulnerable --format json > nuget-audit.json
          jq -e '[.projects[].frameworks[]? | (.topLevelPackages // [])[], (.transitivePackages // [])[] | select(.vulnerabilities != null)] | length == 0' nuget-audit.json

  rust:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: docs/case-studies/issue-1/data/templates/rust
    env:
      CARGO_BUILD_JOBS: "1"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.100.0 --profile minimal --component clippy,rustfmt
      - uses: taiki-e/install-action@v2.90.3
        with:
          tool: cargo-audit@0.23.0
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - run: cargo build --release --locked
      - run: cargo package --locked --allow-dirty
      - run: cargo fmt --manifest-path pipeline/Cargo.toml --check
      - run: cargo clippy --manifest-path pipeline/Cargo.toml --locked --all-targets -- -D warnings
      - run: cargo test --manifest-path pipeline/Cargo.toml --locked
      - run: cargo audit
      - run: cargo audit --file pipeline/Cargo.lock
